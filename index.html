let homeTab = 'all';

function thisMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function renderHome() {
  renderHomeChips();
  renderHomeContent();
}

function renderHomeChips() {
  const bar = $('#home-chip-bar');
  const chips = [
    { key: 'all',     label: '全部' },
    { key: 'expense', label: '消費' },
    ...activeModules().map(k => ({ key: k, label: MODULE_LABELS[k] }))
  ];
  bar.innerHTML = chips.map(c =>
    `<button class="chip${homeTab === c.key ? ' active' : ''}" data-htab="${c.key}">${c.label}</button>`
  ).join('');
  $$('[data-htab]', bar).forEach(btn => btn.onclick = () => {
    homeTab = btn.dataset.htab;
    renderHomeChips();
    renderHomeContent();
  });
}

function renderHomeContent() {
  const el = $('#home-content');
  const ym = thisMonth();
  if      (homeTab === 'all')     renderHomeAll(el, ym);
  else if (homeTab === 'expense') renderHomeExpenseSummary(el, ym);
  else                            renderHomeTradeSummary(el, ym, homeTab);
}

// ── 消費 tab ──────────────────────────────────────────
function renderHomeExpenseSummary(el, ym) {
  const { expense: totalExp, income: totalInc } = monthExpenseSummary(ym);
  const byCat = monthExpenseByCategory(ym);
  const cur   = D.settings.currency;
  const s     = D.settings;

  const catRows = s.categories.filter(c => byCat[c.id] > 0).map(c => {
    const amt    = byCat[c.id] || 0;
    const budget = s.budgets[c.id];
    const pct    = budget ? Math.min(amt / budget * 100, 100) : 0;
    const over   = budget && amt > budget;
    return `<div style="padding:12px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:${budget ? 6 : 0}px">
        <span style="font-size:20px">${c.icon}</span>
        <span style="flex:1;font-size:14px;font-weight:500">${c.name}</span>
        <span style="font-size:14px;font-weight:700;color:${over ? 'var(--red)' : 'var(--text)'}">${fmtAmt(amt, cur)}</span>
        ${budget ? `<span style="font-size:11px;color:var(--text-sub)">/ ${fmtAmt(budget, cur)}</span>` : ''}
      </div>
      ${budget ? `<div class="progress-bar-track">
        <div class="progress-bar-fill${over ? ' over' : ''}" style="width:${pct}%"></div>
      </div>` : ''}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div style="display:flex;gap:10px;padding:16px 16px 0">
      <div class="card" style="flex:1;margin:0;padding:14px">
        <div style="font-size:11px;color:var(--text-sub);margin-bottom:4px">本月支出</div>
        <div class="amt-neg" style="font-size:20px;font-weight:800">${fmtAmt(totalExp, cur)}</div>
      </div>
      <div class="card" style="flex:1;margin:0;padding:14px">
        <div style="font-size:11px;color:var(--text-sub);margin-bottom:4px">本月收入</div>
        <div class="amt-pos" style="font-size:20px;font-weight:800">${fmtAmt(totalInc, cur)}</div>
      </div>
    </div>
    <div class="section-gap"></div>
    <div class="section-label">分類明細</div>
    ${catRows
      ? `<div class="card" style="margin:0 16px;padding:0 16px;overflow:hidden">${catRows}</div>`
      : `<p style="padding:24px;text-align:center;color:var(--text-sub);font-size:13px">本月尚無消費記錄</p>`
    }
    <div style="height:16px"></div>`;
}

  // ── 事件綁定 ──────────────────────────────────────
  $('#chk-dark').onchange = e => {
    s.theme = e.target.checked ? 'dark' : 'light';
    saveSettings(s); applySettings(s);
  };

  $$('[data-clr]', el).forEach(dot => dot.onclick = () => {
    s.accent = dot.dataset.clr;
    saveSettings(s); applySettings(s); renderSettings();
  });

  $$('[data-cur]', el).forEach(btn => btn.onclick = () => {
    s.currency = btn.dataset.cur;
    saveSettings(s); renderSettings();
  });

  $('#row-rate-twd').onclick = () => {
    openTextInput({
      title:       'USD → TWD 匯率',
      hint:        '輸入 1 USD 等於多少 TWD（手動覆蓋，下次 App 開啟會自動更新）',
      value:       twdRate,
      placeholder: '32.0',
      onConfirm:   v => {
        const n = parseFloat(v);
        if (!v || isNaN(n) || n <= 0) { showToast('請輸入有效數字'); return; }
        s.usdRate = n;
        if (!s.rates) s.rates = {};
        s.rates.TWD = n;
        s.ratesUpdatedAt = new Date().toISOString();
        saveSettings(s); renderSettings();
        showToast('TWD 匯率已更新');
      }
    });
  };

  $('#row-rate-aud').onclick = () => {
    openTextInput({
      title:       'USD → AUD 匯率',
      hint:        '輸入 1 USD 等於多少 AUD（手動覆蓋，下次 App 開啟會自動更新）',
      value:       audRate,
      placeholder: '1.52',
      onConfirm:   v => {
        const n = parseFloat(v);
        if (!v || isNaN(n) || n <= 0) { showToast('請輸入有效數字'); return; }
        s.audRate = n;
        if (!s.rates) s.rates = {};
        s.rates.AUD = n;
        s.ratesUpdatedAt = new Date().toISOString();
        saveSettings(s); renderSettings();
        showToast('AUD 匯率已更新');
      }
    });
  };

  $$('[data-skey]', el).forEach(btn => btn.onclick = () => {
    if (btn.disabled) return;
    const key = btn.dataset.skey, dir = parseInt(btn.dataset.sdir);
    const idx = s.moduleOrder.indexOf(key), ni = idx + dir;
    if (ni < 0 || ni >= s.moduleOrder.length) return;
    [s.moduleOrder[idx], s.moduleOrder[ni]] = [s.moduleOrder[ni], s.moduleOrder[idx]];
    saveSettings(s); renderSettings();
  });

  $$('.mod-chk', el).forEach(chk => chk.onchange = () => {
    s.modules[chk.dataset.mkey] = chk.checked;
    saveSettings(s);
  });

  $$('[data-delcat]', el).forEach(btn => btn.onclick = () => {
    const cat = getCatById(btn.dataset.delcat);
    if (!confirm(`刪除「${cat.name}」？\n已有消費記錄不會刪除，但分類顯示為未分類。`)) return;
    s.categories = s.categories.filter(c => c.id !== btn.dataset.delcat);
    delete s.budgets[btn.dataset.delcat];
    saveSettings(s); renderSettings();
  });

  $('#btn-add-cat').onclick = () => openCatModal();

  $$('[data-bcat]', el).forEach(inp => inp.onchange = () => {
    const v = parseFloat(inp.value);
    if (v > 0) s.budgets[inp.dataset.bcat] = v;
    else delete s.budgets[inp.dataset.bcat];
    saveSettings(s);
  });

  // ── Google Sheets ──────────────────────────────────
  $('#row-sheets-id').onclick = () => {
    openTextInput({
      title:       'Google Sheets 試算表 ID',
      hint:        '從試算表網址複製：spreadsheets/d/【這段】/edit',
      value:       s.sheetsId || '',
      placeholder: '1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms',
      onConfirm:   v => { s.sheetsId = v.trim(); saveSettings(s); renderSettings(); }
    });
  };

  $('#row-sheets-url').onclick = () => {
    openTextInput({
      title:       'Apps Script Web App 網址',
      hint:        '部署為 Web App 後取得的 https://script.google.com/... 網址',
      value:       s.sheetsUrl || '',
      placeholder: 'https://script.google.com/macros/s/xxx/exec',
      onConfirm:   v => { s.sheetsUrl = v.trim(); saveSettings(s); renderSettings(); }
    });
  };

  $('#btn-sheets-test').onclick = async () => {
    const btn = $('#btn-sheets-test');
    const status = $('#sheets-status-text');
    if (!s.sheetsUrl) return;
    btn.disabled = true;
    btn.textContent = '測試中…';
    status.textContent = '連線中…';
    try {
      const res = await fetch(s.sheetsUrl + '?action=ping', { method: 'GET' });
      const txt = await res.text();
      if (res.ok && txt.includes('pong')) {
        status.textContent = '✅ 連線成功';
        status.style.color = 'var(--green)';
      } else {
        status.textContent = '⚠️ 回應異常：' + txt.slice(0, 40);
        status.style.color = 'var(--yellow)';
      }
    } catch(e) {
      status.textContent = '❌ 連線失敗：' + e.message.slice(0, 40);
      status.style.color = 'var(--red)';
    }
    btn.disabled = false;
    btn.textContent = '測試';
  };

  $('#btn-sheets-load').onclick = async () => {
    const btn = $('#btn-sheets-load');
    btn.disabled = true; btn.textContent = '載入中…';
    await sheetLoad();
    btn.disabled = false; btn.textContent = '從 Sheets 載入';
  };

  $('#btn-sheets-upload').onclick = async () => {
    const btn = $('#btn-sheets-upload');
    btn.disabled = true; btn.textContent = '上傳中…';
    await sheetUpload();
    btn.disabled = false; btn.textContent = '上傳至 Sheets';
  };

  $('#row-tg').onclick = () => {
    openTextInput({
      title:       'Telegram Bot Token',
      hint:        '留空可清除設定',
      value:       s.tgToken || '',
      placeholder: 'xxxxxxxxxx:AAAAA...',
      onConfirm:   v => { s.tgToken = v; saveSettings(s); renderSettings(); }
    });
  };

  $('#row-line').onclick = () => {
    openTextInput({
      title:       'LINE Channel Access Token',
      hint:        '留空可清除設定',
      value:       s.lineToken || '',
      placeholder: 'eyJ...',
      onConfirm:   v => { s.lineToken = v; saveSettings(s); renderSettings(); }
    });
  };

  $('#btn-export-json').onclick = exportAllJSON;
  $('#btn-clear-data').onclick  = clearAllData;
}

// ── 分類新增 Modal ────────────────────────────────────
const CAT_ICONS = [
  '🍜','🍕','🍣','🍺','☕','🛒','🛍️','💄','👗','💊',
  '🏥','🚇','🚗','⛽','✈️','🏠','💡','📱','💻','🎮',
  '🎬','📚','🏋️','⚽','🎵','🐶','🌿','🔧','📦','🎁'
];
const CAT_COLORS = ['#F59E0B','#EF4444','#3B82F6','#10B981','#8B5CF6','#EC4899','#F97316','#6B7280'];

function openCatModal() {
  let selIcon  = CAT_ICONS[0];
  let selColor = CAT_COLORS[0];

  $('#cat-modal-body').innerHTML = `
    <div class="form-group">
      <label class="form-label">名稱</label>
      <input id="cat-name-inp" type="text" placeholder="分類名稱" maxlength="10">
    </div>
    <div class="form-group">
      <label class="form-label">圖示</label>
      <div class="icon-grid" id="cat-icon-grid">
        ${CAT_ICONS.map(ic => `
          <div class="icon-cell${ic===selIcon?' selected':''}" data-cicon="${ic}">
            <span class="icon-cell-emoji">${ic}</span>
          </div>`).join('')}
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">顏色</label>
      <div class="color-picker">
        ${CAT_COLORS.map(clr => `
          <span class="color-dot${clr===selColor?' selected':''}" data-cclr="${clr}"
                style="background:${clr};width:28px;height:28px"></span>`).join('')}
      </div>
    </div>`;

  $('#cat-modal-footer').innerHTML = `
    <button class="btn btn-secondary" id="btn-cat-cancel">取消</button>
    <button class="btn btn-primary"   id="btn-cat-save">新增</button>`;

  openModal('cat-modal');
  $('#cat-name-inp').focus();

  const body = $('#cat-modal-body');

  $$('[data-cicon]', body).forEach(cell => cell.onclick = () => {
    selIcon = cell.dataset.cicon;
    $$('[data-cicon]', body).forEach(c => c.classList.remove('selected'));
    cell.classList.add('selected');
  });

  $$('[data-cclr]', body).forEach(dot => dot.onclick = () => {
    selColor = dot.dataset.cclr;
    $$('[data-cclr]', body).forEach(d => d.classList.remove('selected'));
    dot.classList.add('selected');
  });

  $('#btn-cat-cancel').onclick = () => closeModal('cat-modal');
  $('#btn-cat-save').onclick = () => {
    const name = $('#cat-name-inp').value.trim();
    if (!name) { showToast('請輸入分類名稱'); return; }
    D.settings.categories.push({
      id: 'cat_' + genId(), icon: selIcon, name, color: selColor
    });
    saveSettings(D.settings);
    closeModal('cat-modal');
    renderSettings();
    showToast('已新增「' + name + '」');
  };
}

// ── Modal 開關工具 ────────────────────
function openModal(id)  { var el = document.querySelector('#'+id); if(el) el.classList.add('open'); }
function closeModal(id) { var el = document.querySelector('#'+id); if(el) el.classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// ── PWA Manifest 動態注入 ────────────────────
function initManifest() {
  var accent = D.settings.accent || '#2563EB';
  var svgSrc = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">' +
    '<rect width="192" height="192" rx="40" fill="' + accent + '"/>' +
    '<text x="96" y="130" font-size="100" text-anchor="middle" font-family="system-ui" fill="white">帳</text>' +
    '</svg>'
  );
  var manifest = {
    name: '記帳 App',
    short_name: '記帳',
    start_url: '.',
    display: 'standalone',
    background_color: '#ffffff',
    theme_color: accent,
    icons: [
      { src: svgSrc, sizes: '192x192', type: 'image/svg+xml' },
      { src: svgSrc, sizes: '512x512', type: 'image/svg+xml' }
    ]
  };
  var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  var url  = URL.createObjectURL(blob);
  var link = document.createElement('link');
  link.rel  = 'manifest';
  link.href = url;
  document.head.appendChild(link);
}

document.addEventListener('DOMContentLoaded', function() {
  applySettings(D.settings);
  initManifest();

  document.querySelectorAll('.nav-item[data-page]').forEach(function(btn) {
    btn.addEventListener('click', function() { navigateTo(btn.dataset.page); });
  });

  document.querySelector('#btn-expense-modal-close').addEventListener('click',    function() { closeModal('expense-modal'); });
  document.querySelector('#btn-trade-modal-close').addEventListener('click',      function() { closeModal('trade-modal'); });
  document.querySelector('#btn-position-modal-close').addEventListener('click',   function() { closeModal('position-modal'); });
  document.querySelector('#btn-cat-modal-close').addEventListener('click',        function() { closeModal('cat-modal'); });
  document.querySelector('#btn-text-input-modal-close').addEventListener('click', function() { closeModal('text-input-modal'); });

  document.querySelector('#btn-month-prev').addEventListener('click', function() { expenseMonth = shiftMonth(expenseMonth, -1); renderExpense(); });
  document.querySelector('#btn-month-next').addEventListener('click', function() { expenseMonth = shiftMonth(expenseMonth, +1); renderExpense(); });

  // 跳轉到指定日期：切換月份 + 捲動到該日期分組
  function jumpToExpenseDate(dateStr) {
    expenseMonth = dateStr.slice(0, 7);
    if (currentPage !== 'expense') navigateTo('expense');
    renderExpense();
    setTimeout(function() {
      var target = document.querySelector('[data-dgh="' + dateStr + '"]');
      if (target && target.scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      else showToast(fmtDateShort(dateStr) + ' 當天沒有記錄');
    }, 80);
  }

  // 月份標籤上覆蓋著透明的日期選擇 input，點標籤＝點 input，直接開原生選擇器
  var jumpInput = document.querySelector('#expense-date-jump');
  jumpInput.value = expenseMonth + '-01';
  jumpInput.addEventListener('change', function() {
    if (jumpInput.value) jumpToExpenseDate(jumpInput.value);
  });

  document.querySelector('#btn-add-expense').addEventListener('click',  function() { openExpenseModal(); });
  document.querySelector('#btn-add-trade').addEventListener('click',    function() { openTradeModal(); });
  document.querySelector('#btn-add-position').addEventListener('click', function() { openPositionModal(); });

  document.querySelector('#btn-export-expense').addEventListener('click', function() {
    var items = getExpensesByMonth(expenseMonth);
    if (!items.length) { showToast('本月尚無記錄'); return; }
    exportExpensesCSV(items);
  });

  fetchExchangeRates();
  fetchExchangeRates();
  sheetLoad();
  navigateTo('home');
});
</script>
